    let myFavourites = JSON.parse(localStorage.getItem('ott_favourites')) || [];

    // --- Core Interaction & Panel Controller ---
    function navAction(action, element) {
        const items = document.querySelectorAll('.nav-item');
        items.forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        
        // Panels clear logic
        document.getElementById('chatOverlay').classList.remove('active');
        document.getElementById('historyOverlay').classList.remove('active');
        document.getElementById('favOverlay').classList.remove('active');

        if (action === 'home') {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (action === 'chat') {
            document.getElementById('chatOverlay').classList.add('active');
        } else if (action === 'favourite') {
            renderFavourites();
            document.getElementById('favOverlay').classList.add('active');
        } else if (action === 'history') {
            renderHistory();
            document.getElementById('historyOverlay').classList.add('active');
        }
    }

    function closePanels() {
        document.getElementById('chatOverlay').classList.remove('active');
        document.getElementById('historyOverlay').classList.remove('active');
        document.getElementById('favOverlay').classList.remove('active');
        
        const items = document.querySelectorAll('.nav-item');
        items.forEach(item => item.classList.remove('active'));
        items[0].classList.add('active'); 
    }

    // --- Ultimate UI Dynamic Modal Engine ---
    const modal = document.getElementById('dynamicModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalActionBtn = document.getElementById('modalActionBtn');

    function openItemModal(index) {
        currentItem = catalogData[index];
        modalTitle.innerText = currentItem.title;
        modalBody.innerHTML = '';
        modalActionBtn.style.display = 'none';

        // Synchronize heart animation state from storage
        const favBtn = document.getElementById('favToggleBtn');
        const isAlreadyFav = myFavourites.some(item => item.id === currentItem.id);
        if (isAlreadyFav) {
            favBtn.classList.add('liked');
        } else {
            favBtn.classList.remove('liked');
        }

        if (currentItem.type === 'movie') {
            // Render Movie UI Variant
            modalBody.innerHTML = '<div class="movie-content">Premium high-speed server links are active. Click below to continue streaming or downloading.</div>';
            modalActionBtn.href = currentItem.link;
            modalActionBtn.style.display = 'flex';
            
            // Direct Link History Tracker
            modalActionBtn.onclick = function() {
                addToHistory(currentItem, "Movie Content");
            };
        } else {
            // Render Web Series/Anime Tab Layout Variant
            const keys = Object.keys(currentItem.seasons);
            const seasonTabsDiv = document.createElement('div');
            seasonTabsDiv.className = 'season-tabs';
            
            const gridDiv = document.createElement('div');
            gridDiv.className = 'episode-grid';

            function loadSeason(seasonName, btnElement) {
                document.querySelectorAll('.btn-season').forEach(b => b.classList.remove('active'));
                if(btnElement) btnElement.classList.add('active');

                gridDiv.innerHTML = '';
                modalActionBtn.style.display = 'none';

                const episodes = currentItem.seasons[seasonName];
                episodes.forEach((link, idx) => {
                    const epLink = document.createElement('a');
                    epLink.href = '#';
                    epLink.className = 'btn-ep';
                    epLink.textContent = idx + 1;
                    epLink.style.animationDelay = `${(idx % 15) * 0.05}s`;
                    
                    epLink.onclick = function(e) {
                        e.preventDefault();
                        document.querySelectorAll('.btn-ep').forEach(ep => {
                            ep.classList.remove('selected');
                            ep.style.animation = ''; 
                        });
                        this.classList.add('selected');
                        modalActionBtn.href = link;
                        modalActionBtn.style.display = 'flex';
                        
                        // Series/Episode Tracker
                        modalActionBtn.onclick = function() {
                            addToHistory(currentItem, seasonName + " - Episode " + (idx + 1));
                        };
                    };
                    gridDiv.appendChild(epLink);
                });
            }

            keys.forEach((seasonName, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-season';
                if(idx === 0) btn.classList.add('active');
                btn.innerText = seasonName;
                btn.onclick = () => loadSeason(seasonName, btn);
                seasonTabsDiv.appendChild(btn);
            });

            modalBody.appendChild(seasonTabsDiv);
            modalBody.appendChild(gridDiv);
            if(keys.length > 0) loadSeason(keys[0], seasonTabsDiv.firstChild);
        }
        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
        modalActionBtn.style.display = 'none';
    }

    // --- ❤️ Favourite Core Processing Engine ❤️ ---
    function toggleFavourite() {
        const favBtn = document.getElementById('favToggleBtn');
        favBtn.classList.toggle('liked');

        if (favBtn.classList.contains('liked')) {
            if (!myFavourites.some(item => item.id === currentItem.id)) {
                myFavourites.push({
                    id: currentItem.id,
                    title: currentItem.title,
                    category: currentItem.category,
                    img: currentItem.img
                });
            }
        } else {
            myFavourites = myFavourites.filter(item => item.id !== currentItem.id);
        }
        
        localStorage.setItem('ott_favourites', JSON.stringify(myFavourites));
        renderFavourites();
    }

    function removeFavouriteFromList(id) {
        myFavourites = myFavourites.filter(item => item.id !== id);
        localStorage.setItem('ott_favourites', JSON.stringify(myFavourites));
        
        if (currentItem && currentItem.id === id) {
            document.getElementById('favToggleBtn').classList.remove('liked');
        }
        renderFavourites();
    }

    function renderFavourites() {
        const container = document.getElementById('favContentArea');
        container.innerHTML = '';

        if (myFavourites.length === 0) {
            container.innerHTML = '<p class="empty-text">No premium titles bookmarked yet.</p>';
            return;
        }

        myFavourites.forEach(item => {
            const originalIndex = catalogData.findIndex(c => c.id === item.id);
            container.innerHTML += `
                <div class="list-card">
                    <img src="${item.img}" class="list-img" onclick="closePanels(); openItemModal(${originalIndex});">
                    <div class="list-info" onclick="closePanels(); openItemModal(${originalIndex});">
                        <h4>${item.title}</h4>
                        <p>${item.category}</p>
                    </div>
                    <button class="panel-action-btn" style="color:#ff0000;" onclick="removeFavouriteFromList('${item.id}')">
                        <span class="material-symbols-rounded" style="font-variation-settings:'FILL' 1;">favorite</span>
                    </button>
                </div>`;
        });
    }

    function addToHistory(item, watchDetail) {
        const timeStamp = new Date().toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
        
        // Remove existing copy if available to push latest action on top
        myHistory = myHistory.filter(h => h.id !== item.id);
        
        myHistory.unshift({
            id: item.id,
            title: item.title,
            img: item.img,
            detail: watchDetail,
            time: timeStamp
        });

        if(myHistory.length > 30) myHistory.pop(); // Maintain memory bounds
        localStorage.setItem('ott_history', JSON.stringify(myHistory));
        renderHistory();
    }

    function deleteHistoryItem(id) {
        myHistory = myHistory.filter(h => h.id !== id);
        localStorage.setItem('ott_history', JSON.stringify(myHistory));
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('historyContentArea');
        container.innerHTML = '';

        if (myHistory.length === 0) {
            container.innerHTML = '<p class="empty-text">No streaming footprints recorded.</p>';
            return;
        }

        myHistory.forEach(item => {
            const originalIndex = catalogData.findIndex(c => c.id === item.id);
            container.innerHTML += `
                <div class="list-card">
                    <img src="${item.img}" class="list-img" onclick="closePanels(); openItemModal(${originalIndex});">
                    <div class="list-info" onclick="closePanels(); openItemModal(${originalIndex});">
                        <h4>${item.title}</h4>
                        <p style="color:#ffcc00; font-size:0.75rem;">⏱️ ${item.detail}</p>
                        <p style="font-size:0.7rem; color:#aaa;">${item.time}</p>
                    </div>
                    <button class="panel-action-btn" style="color:#888;" onclick="deleteHistoryItem('${item.id}')">
                        <span class="material-symbols-rounded">delete</span>
                    </button>
                </div>`;
        });
    }

    // --- Spell Check & Automation Search Core Matrix ---
    function isValidSearchQuery(str) {
        str = str.toLowerCase().trim();
        if(str.length < 3) return false; 
        if(/(.)\1{3,}/.test(str)) return false; 
        const smashes = ["asdf", "qwer", "zxcv", "hjkl", "uiop", "vbhj", "dfgh", "erty"];
        for(let smash of smashes) { if(str.includes(smash)) return false; }
        if(/^[bcdfghjklmnpqrstvwxyz]{6,}$/i.test(str)) return false;
        return true; 
    }

    function autoSortEngine() {
        catalogData.sort((a, b) => {
            let dateA = new Date(a.date || "2000-01-01");
            let dateB = new Date(b.date || "2000-01-01");
            return dateB - dateA; 
        });
        filteredData = [...catalogData];
    }

    function toggleChat() { document.getElementById("chatOverlay").classList.toggle("active"); }

    function sendChatMessage() {
        const input = document.getElementById("chatInput");
        const messageText = input.value.trim();
        if (!messageText) return;
        
        const linkPattern = /(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9-]+\.[a-zA-Z]{2,})/gi;
        if (linkPattern.test(messageText)) {
            alert("⚠️ Warning: Sharing links or URLs is strictly blocked in this chatroom!");
            input.value = ""; return;
        }
        
        const msgArea = document.getElementById("chatMessages");
        const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const newMsg = document.createElement("div");
        newMsg.className = "msg";
        newMsg.innerHTML = messageText + ' <span class="msg-time">' + currentTime + '</span>';
        msgArea.appendChild(newMsg);
        input.value = "";
        msgArea.scrollTop = msgArea.scrollHeight;
    }
    
    function handleChatKey(event) { if (event.key === "Enter") { sendChatMessage(); } }

    function filterByCategory(cat) {
        activeCategory = cat;
        const buttons = document.querySelectorAll(".cat-btn");
        buttons.forEach(btn => btn.classList.remove("active"));
        event.target.classList.add("active");
        document.getElementById("searchInput").value = ""; 
        applyFilters();
    }

    function getLevenshteinDistance(a, b) {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
        for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) == a.charAt(j - 1)) { matrix[i][j] = matrix[i - 1][j - 1]; } 
                else { matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)); }
            }
        }
        return matrix[b.length][a.length];
    }

    function advancedSearchEngine() {
        applyFilters(); 
        let input = document.getElementById("searchInput").value.trim();
        clearTimeout(searchTimeout); 
        
        if (filteredData.length === 0 && isValidSearchQuery(input)) {
            searchTimeout = setTimeout(() => { sendToTelegram(input); }, 1500); 
        }
    }

    function applyFilters() {
        let input = document.getElementById("searchInput").value.toLowerCase().trim();
        const sliderSection = document.getElementById("sliderSection");
        const categoryWrapper = document.getElementById("categoryWrapper");

        if (input.length > 0) {
            if (sliderSection) sliderSection.style.display = "none";
            if (categoryWrapper) categoryWrapper.style.display = "none";
        } else {
            if (sliderSection) sliderSection.style.display = "block";
            if (categoryWrapper) categoryWrapper.style.display = "block";
        }
        
        filteredData = catalogData.filter(item => {
            if (activeCategory !== "All" && input.length === 0) {
                if (activeCategory === "Latest" && !item.trending) return false;
                if (activeCategory !== "Latest" && item.category !== activeCategory) return false;
            }
            if (!input) return true;

            let titleMatch = item.title.toLowerCase().includes(input);
            let keywordMatch = item.keywords && item.keywords.toLowerCase().includes(input);
            if (titleMatch || keywordMatch) return true;

            const inputWords = input.split(' ');
            const titleWords = item.title.toLowerCase().split(' ');
            for(let iw of inputWords) {
                if(iw.length < 4) continue; 
                for(let tw of titleWords) { if(getLevenshteinDistance(iw, tw) <= 2) return true; }
            }
            return false;
        });

        filteredData.sort((a, b) => {
            let dateA = new Date(a.date || "2000-01-01");
            let dateB = new Date(b.date || "2000-01-01");
            return dateB - dateA; 
        });
        renderGallery(true);
    }

    function renderGallery(reset = false) {
        const container = document.getElementById("gallery");
        const loadMoreContainer = document.getElementById("loadMoreContainer");

        if (reset) { container.innerHTML = ""; currentPage = 1; }

        if (filteredData.length === 0) {
            let searchedText = document.getElementById("searchInput").value.trim();
            loadMoreContainer.style.display = "none";
            if (isValidSearchQuery(searchedText)) {
                container.innerHTML = '<div class="not-found-container"><h2 class="not-found-title">Oops! Not Available Right Now</h2><p style="color:#1a1a2e; font-weight:600;">But don\'t worry, <strong>"' + searchedText + '"</strong> is</p><span class="coming-soon-text">🚀 Coming in 2 Days!</span></div>';
            } else {
                container.innerHTML = '<div class="not-found-container" style="border-color: #ff4757; background: #fff5f5;"><h2 class="not-found-title">❌ Invalid Search</h2><p style="color:#1a1a2e; font-weight:600;">Please enter the correct spelling to search.</p></div>';
            }
            return;
        }

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = filteredData.slice(start, end);

        pageItems.forEach((item) => {
            const originalIndex = catalogData.findIndex(c => c.id === item.id);
            const card = document.createElement("div");
            card.className = "card";
            card.onclick = () => openItemModal(originalIndex);
            card.innerHTML = '<img src="' + item.img + '" alt="' + item.title + '" loading="lazy">' +
                             '<div class="info"><h3>' + item.title + '</h3></div>';
            container.appendChild(card);
        });

        if (end >= filteredData.length) { loadMoreContainer.style.display = "none"; } 
        else { loadMoreContainer.style.display = "block"; }
    }

    function loadNextPage() { currentPage++; renderGallery(); }

    window.onclick = function(event) { if (event.target == modal) { closeModal(); } }

    // --- Boot Initializer ---
    document.addEventListener("DOMContentLoaded", () => { 
        autoSortEngine(); 
        renderGallery(true);
        renderFavourites();
        renderHistory();
    });
</script>
